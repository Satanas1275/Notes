name: Android Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Notes-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release artifacts
        if: ${{ env.KEYSTORE_PATH != '' }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload release APK
        if: ${{ env.KEYSTORE_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Notes-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        if: ${{ env.KEYSTORE_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Notes-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_PATH != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
